apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: basic3tier-api
  template:
    metadata:
      labels:
        app: basic3tier-api
    spec:
      containers:
      - name: api-container
        image: <your-dockerhub-username>/basic3tier-api:latest
        ports:
        - containerPort: 80
        env:
        - name: ConnectionStrings__Basic3Tier
          valueFrom:
            secretKeyRef:
              name: basic3tier-db
              key: connection-string
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: basic3tier-api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP