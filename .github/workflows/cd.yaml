name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: "Deploy the latest images to EC2 after checking the host and database secret"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.deploy_to_ec2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST secret is missing."; exit 1; }
          test -n "$EC2_PRIVATE_KEY" || { echo "::error::EC2_PRIVATE_KEY secret is missing."; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::DOCKERHUB_USERNAME secret is missing."; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "::error::POSTGRES_PASSWORD secret is missing."; exit 1; }

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY }}

      - name: Deploy containers to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          # Base64 keeps special characters in the password safe when passing it to the remote shell.
          POSTGRES_PASSWORD_B64="$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w0)"

          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "ubuntu@$EC2_HOST" \
            "POSTGRES_PASSWORD_B64='$POSTGRES_PASSWORD_B64' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' EC2_HOST='$EC2_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          POSTGRES_PASSWORD="$(printf '%s' "$POSTGRES_PASSWORD_B64" | base64 -d)"

          sudo docker pull "$DOCKERHUB_USERNAME/basic3tier-api:latest"
          sudo docker pull "$DOCKERHUB_USERNAME/basic3tier-ui:latest"

          sudo docker network create my3tier 2>/dev/null || true
          sudo docker volume create my3tier-db-data >/dev/null

          sudo docker rm -f my3tier-ui my3tier-api my3tier-db 2>/dev/null || true

          sudo docker run -d --restart unless-stopped \
            --network my3tier --name my3tier-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=basic3tier \
            -v my3tier-db-data:/var/lib/postgresql \
            postgres:18-alpine

          sudo docker run -d --restart unless-stopped \
            --network my3tier --name my3tier-api \
            -p 5000:80 \
            -e "ConnectionStrings__Basic3Tier=Host=my3tier-db;Port=5432;Database=basic3tier;Username=postgres;Password=$POSTGRES_PASSWORD" \
            "$DOCKERHUB_USERNAME/basic3tier-api:latest"

          sudo docker run -d --restart unless-stopped \
            --network my3tier --name my3tier-ui \
            -p 80:80 \
            -e "API_URL=http://$EC2_HOST:5000/" \
            "$DOCKERHUB_USERNAME/basic3tier-ui:latest"
          REMOTE
