name: CI Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t basic3tier-api:ci ./api

      - name: Build UI image
        run: docker build -t basic3tier-ui:ci ./ui

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        if: ${{ github.event_name == 'push' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::DOCKERHUB_USERNAME secret is missing."; exit 1; }
          docker tag basic3tier-api:ci "$DOCKERHUB_USERNAME/basic3tier-api:latest"
          docker tag basic3tier-ui:ci "$DOCKERHUB_USERNAME/basic3tier-ui:latest"
          docker push "$DOCKERHUB_USERNAME/basic3tier-api:latest"
          docker push "$DOCKERHUB_USERNAME/basic3tier-ui:latest"
